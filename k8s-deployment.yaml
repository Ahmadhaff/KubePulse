apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeagent-deployment
  labels:
    app: kubeagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeagent
  template:
    metadata:
      labels:
        app: kubeagent
    spec:
      containers:
        - name: kubeagent
          image: kubeagent:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # Create the secret first (see README):
            #   kubectl create secret generic anthropic-api-key --from-literal=ANTHROPIC_API_KEY=<your key>
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: ANTHROPIC_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeagent-service
spec:
  type: NodePort
  selector:
    app: kubeagent
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
